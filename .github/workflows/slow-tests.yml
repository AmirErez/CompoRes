# This workflow runs lint and the slow tests (`pytest -m slow`); it is started manually, from the Actions tab

name: Slow Tests

on:
  workflow_dispatch:

jobs:
  test-src:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      checks: write
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install linter
        run: pip install flake8
      - name: Run linter
        working-directory: ./src/compores
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=30 --max-line-length=120 --statistics
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          activate-environment: compores_env
          environment-file: ./env/compores_env.yml
          python-version: ${{ matrix.python-version }}
          auto-activate-base: false
      - run: conda info
      - run: conda list
      - run: conda config --show-sources
      - name: Install dependencies
        run: |
          conda activate compores_env
          pip install -e .
      - name: Run tests and build coverage file
        run: |
          # Fail the step when pytest fails, not only when `tee` does
          set -o pipefail
          export PYTHONPATH="${PYTHONPATH}:$GITHUB_WORKSPACE/src"
          export PYTHONPATH="${PYTHONPATH}:$GITHUB_WORKSPACE/src/compores"
          pytest -m slow --cov-config=.coveragerc --junitxml=pytest.xml \
          --cov-report=term-missing:skip-covered \
          --cov src/compores tests/ | tee test_coverage.txt
      - name: Pytest coverage comment
        id: coverageComment
        uses: MishaKav/pytest-coverage-comment@main
        with:
          title: Coverage Report
          pytest-coverage-path: test_coverage.txt
          junitxml-path: pytest.xml
