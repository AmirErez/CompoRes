name: compores_env
channels:
  - conda-forge
  - nodefaults
# Versions are pinned to the minor release that the test suite was run with; patch releases are allowed
dependencies:
  - python=3.12
  - numpy=2.5
  - pandas=3.1
  - scipy=1.18
  - matplotlib=3.11
  - scikit-learn=1.9
  - statsmodels=0.15
  - seaborn=0.13
  - pyyaml=6.0
  - numba=0.68
  - fastparquet=2026.5
  - pytest=9.1
  - pytest-cov=7.1
  - pip
